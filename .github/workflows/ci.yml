name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm audit --omit=dev
      - run: npm run bundle

      - uses: actions/upload-artifact@v7
        with:
          name: doklado-mcp.mcpb
          path: doklado-mcp.mcpb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches package.json and manifest.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for file in package.json manifest.json; do
            version=$(node -p "require('./$file').version")
            if [ "$version" != "$tag" ]; then
              echo "$file has $version but the tag is $tag"
              exit 1
            fi
          done

      - uses: actions/download-artifact@v8
        with:
          name: doklado-mcp.mcpb

      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" doklado-mcp.mcpb --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
